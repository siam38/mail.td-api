name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Syntax-check all sources
        run: |
          for f in src/*.js examples/*.js; do
            node --input-type=module --check < "$f"
          done
      - name: Import check
        run: node -e "import('./src/mailtd.js').then(() => console.log('client imports OK'))"
